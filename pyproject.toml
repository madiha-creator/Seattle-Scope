[project]
name = "seattle-scope"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pandas",
    "numpy",
    "requests",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "pymannkendall",
    "statsmodels",
]

[tool.vercel]
entrypoint = "backend.main:app"
